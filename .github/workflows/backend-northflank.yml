name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-northflank.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-northflank.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Run backend tests
        run: python -m pytest -q backend/tests

      # Build with the same context and Dockerfile used by Northflank.
      - name: Build production image
        run: docker build --file backend/Dockerfile --tag socratic-backend:ci backend

  deploy:
    name: Trigger Northflank production release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger release hook
        env:
          NORTHFLANK_DEPLOY_HOOK_URL: ${{ secrets.NORTHFLANK_DEPLOY_HOOK_URL }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$NORTHFLANK_DEPLOY_HOOK_URL" ]; then
            echo "NORTHFLANK_DEPLOY_HOOK_URL is not configured; skipping production deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST "$NORTHFLANK_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            --data "{\"commit_sha\":\"$GIT_SHA\"}"
