name: Frontend CI and Vercel deploy

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-vercel.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Existing formatting debt is handled separately; keep code-quality rules active.
      - run: "npm run lint -- --rule 'prettier/prettier: off' --quiet"
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    # The connected Vercel Git integration deploys by default. Enable CLI deploy only
    # after adding all three credentials and disabling Vercel's Git auto-deploy.
    if: vars.VERCEL_CLI_DEPLOY == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Vercel credentials
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          if grep -q 'YOUR-BACKEND-DOMAIN.invalid' frontend/vercel.json; then
            echo "Set the backend HTTPS origin in frontend/vercel.json before deploying" >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token="$VERCEL_TOKEN"
      - name: Build for Vercel
        run: vercel build ${{ github.event_name == 'pull_request' && '' || '--prod' }} --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
